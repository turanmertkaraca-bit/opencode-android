name: android build & test

# The Android toolchain (JDK + SDK + Gradle) does not fit in the on-device
# guest, so this workflow is the sanctioned compiler: it compiles the app,
# runs the Robolectric JVM suite, packages a signed debug APK, renders UI
# screenshots, and (on a version tag) publishes a GitHub Release.
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # AGP 8.5.2 needs JDK 17+; the project's build_apk.sh uses 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The runner image already ships the Android SDK; the setup-android
      # action is avoided because it runs `sdkmanager tools`, a removed
      # package. Point Gradle at the preinstalled SDK instead.
      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n1)"
          echo "using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Best effort: the ~60 MB opencode payload is not in git. When present the
      # packaged APK is complete; when the download fails the compile/test still run.
      - name: Restore bundled payload (best effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app/src/main/assets
          gh release download --repo "$GITHUB_REPOSITORY" -p 'opencode-linux-arm64-android.tar.gz' \
            -O app/src/main/assets/oc_pkg.bin --clobber || echo "payload unavailable; continuing"
          ls -la app/src/main/assets/oc_pkg.bin 2>/dev/null || true

      - name: Compile + run JVM tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace --continue

      - name: Package debug APK (signed with the in-repo persistent keystore)
        run: gradle assembleDebug --no-daemon --stacktrace

      # Gate: every APK must carry the project's persistent key, or an update
      # over an existing install would fail with a signature mismatch.
      - name: Verify signing certificate
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER="${ANDROID_HOME}/build-tools/34.0.0/apksigner"
          CERT="$("$APKSIGNER" verify --print-certs "$APK" | grep -i 'SHA-256 digest' | head -1 | sed 's/.*: //' | tr -d ' :' | tr 'A-F' 'a-f')"
          echo "signer SHA-256: $CERT"
          EXPECT="a895ac0fd6619a7ddfe3bacd0c5a31d44193513507499798b248ae9cd26d1b34"
          [ "$CERT" = "$EXPECT" ] || { echo "SIGNING CERT MISMATCH — result would not install in place"; exit 1; }
          echo "signing OK: the persistent key"

      - name: Test summary
        if: always()
        run: |
          echo "== test result files =="
          find app/build/test-results -name '*.xml' 2>/dev/null | wc -l
          grep -h '<testsuite ' app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null \
            | sed -E 's/.*name="([^"]+)".*tests="([0-9]+)".*failures="([0-9]+)".*errors="([0-9]+)".*/\1: tests=\2 failures=\3 errors=\4/' \
            | sort || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: app/build/screenshots
          if-no-files-found: ignore

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          TAG="${GITHUB_REF_NAME}"                 # e.g. v0.52.0-p52
          VER="${TAG#v}"                           # 0.52.0-p52
          PNUM="${VER##*-p}"                       # 52
          BASE="${VER%-p*}"                        # 0.52.0
          NAMED="opencode-p${PNUM}-v${BASE}-debug.apk"
          cp "$APK" "$NAMED"
          sha256sum "$NAMED" > SHA256SUMS.txt
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes "Automated build from ${GITHUB_SHA}."
          gh release upload "$TAG" "$NAMED" SHA256SUMS.txt --clobber
