name: init signing keystore

# One-shot: generate the persistent debug keystore that every later build signs
# with, so APKs update in place instead of tripping Android's signature check.
# The generated file is uploaded as an artifact and then committed into the repo
# at keystore/debug.keystore (a debug key; the app is a sideloaded debug build).
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/init-keystore.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Generate persistent keystore
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/debug.keystore \
            -storetype PKCS12 \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          keytool -list -v -keystore keystore/debug.keystore -storepass android \
            | grep -E 'Alias name|SHA256:'
      - uses: actions/upload-artifact@v4
        with:
          name: persistent-debug-keystore
          path: keystore/debug.keystore
